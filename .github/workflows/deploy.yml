name: Deploy Werewolf Pages

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout production
        uses: actions/checkout@v4
        with:
          ref: main
          path: production

      - name: Checkout development
        uses: actions/checkout@v4
        with:
          ref: dev
          path: development

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install production dependencies
        run: npm install --prefix production --no-audit --no-fund

      - name: Test production
        run: npm test --prefix production

      - name: Install development dependencies
        run: npm install --prefix development --no-audit --no-fund

      - name: Test development
        run: npm test --prefix development

      - name: Validate historical import script syntax
        run: bash -n development/scripts/migrate-werewolf-to-shared.sh

      - name: Build production
        run: |
          SITE_ROOT="$GITHUB_WORKSPACE/production" SITE_BASE="/werewolf/" SITE_OUT="$GITHUB_WORKSPACE/_site" npm run build --prefix production

      - name: Build development
        run: |
          SITE_ROOT="$GITHUB_WORKSPACE/development" SITE_BASE="/werewolf/dev/" SITE_OUT="$GITHUB_WORKSPACE/_site/dev" npm run build --prefix development

      - name: Stamp footer and prepare Pages
        run: |
          sed -i "s/__BUILD_VERSION__/$(git -C production rev-parse --short HEAD)/g" _site/index.html
          sed -i "s/__BUILD_VERSION__/$(git -C development rev-parse --short HEAD)/g" _site/dev/index.html
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
