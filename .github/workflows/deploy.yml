name: Deploy Werewolf Pages

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout production
        uses: actions/checkout@v4
        with:
          ref: main
          path: production

      - name: Checkout development
        uses: actions/checkout@v4
        with:
          ref: dev
          path: development

      - name: Test
        run: cd development && npm test

      - name: Prepare static files
        run: |
          mkdir -p _site/dev
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='tests/' --exclude='scripts/' --exclude='supabase/' --exclude='node_modules/' --exclude='package*.json' --exclude='requirements-build.txt' production/ _site/
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='tests/' --exclude='scripts/' --exclude='supabase/' --exclude='node_modules/' --exclude='package*.json' --exclude='requirements-build.txt' development/ _site/dev/
          touch _site/.nojekyll
          # Publish each release under its own URL so cached modules cannot mix versions.
          for site in production development; do
            if [ "$site" = production ]; then
              target="_site"
            else
              target="_site/dev"
            fi
            revision="$(git -C "$site" rev-parse --short HEAD)"
            mkdir -p "$target/assets/$revision"
            cp "$site/app.js" "$target/assets/$revision/app.js"
            cp "$site/styles.css" "$target/assets/$revision/styles.css"
            cp -R "$site/src" "$target/assets/$revision/src"
            sed -i "s|href=\"./styles.css\"|href=\"./assets/$revision/styles.css\"|; s|src=\"./app.js\"|src=\"./assets/$revision/app.js\"|" "$target/index.html"
          done
          sed -i "s/__BUILD_VERSION__/$(git -C production rev-parse --short HEAD)/g" _site/index.html
          sed -i "s/__BUILD_VERSION__/$(git -C development rev-parse --short HEAD)/g" _site/dev/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
