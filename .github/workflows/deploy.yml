name: Deploy Werewolf Pages

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout production
        uses: actions/checkout@v4
        with:
          ref: main
          path: production

      - name: Checkout development
        uses: actions/checkout@v4
        with:
          ref: dev
          path: development

      - name: Assemble site
        run: |
          mkdir -p _site/dev
          rsync -a --exclude='.git' --exclude='.github' production/ _site/
          rsync -a --exclude='.git' --exclude='.github' development/ _site/dev/
          touch _site/.nojekyll

      - name: Generate browser and iOS icons
        run: |
          python3 -m pip install --quiet cairosvg Pillow
          if [ -f _site/favicon.svg ]; then
            python3 development/scripts/build_icons.py _site/favicon.svg _site
          fi
          python3 development/scripts/build_icons.py _site/dev/favicon.svg _site/dev

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
